name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · boundaries · unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check

  build:
    name: build (pages + capacitor base)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run build:cap
      - uses: actions/upload-artifact@v6
        with: { name: dist-capacitor, path: dist, retention-days: 7 }

  e2e:
    # 102 개 시나리오를 한 러너에서 돌리면 25 분을 넘긴다(느린 러너) — 3 묶음으로 나눠 병렬로
    name: e2e (fake mic WAV) ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v7
        with: { name: dist-capacitor, path: dist }
      - run: test -f dist/index.html # 아티팩트가 다른 곳에 풀리면 serve 가 디렉터리 목록을 내놓고 e2e 가 전부 실패한다 — 여기서 바로 멈춘다
      - uses: actions/cache@v5
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright install-deps chromium
      - run: node scripts/e2e.mjs --dist dist --shard ${{ matrix.shard }}

  screenshots:
    # 기준선(test-assets/screens/baseline)은 개발 환경에서 찍은 것이라 글꼴이 다른 CI 에서는 늘 '다르다' 고 나온다 —
    # 비교는 패치마다 개발 환경에서 하고(npm run shots), CI 는 찍어서 아티팩트로 남기기만 한다
    name: screenshots (artifact)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v5
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: |
          npx playwright install-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - run: node scripts/screenshots.mjs --serve --out test-assets/screens/current
      - uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: test-assets/screens/current/*.png
          if-no-files-found: ignore
          retention-days: 14
